name: Atualizar dados da TV Corporativa

on:
  schedule:
    - cron: "7 * * * *" # uma vez por hora, no minuto 7
  workflow_dispatch:
  push:
    paths:
      - "scraper.py"
      - ".github/workflows/atualizar_tv.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-dados-tv
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Executar scraper
        run: python scraper.py

      - name: Publicar JSON atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados_tv.json
          if git diff --cached --quiet; then
            echo "Sem alterações no JSON."
          else
            git commit -m "chore: atualizar dados da TV corporativa"
            git push
          fi
